<div class="container">
  <h2>Register</h2>
  <form [formGroup]="regForm" (ngSubmit)="onSubmit()">
    
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" id="name" formControlName="name" class="form-control">
    </div> 

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" formControlName="email" class="form-control">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" formControlName="password" class="form-control">
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input type="phone" id="phone" formControlName="phone" class="form-control">
    </div>

    <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select id="role" formControlName="role" class="form-select" (change)="onRoleChange($event)">
        <option value="USER">User</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

    <!-- Admin Code field, hidden by default -->
    <div class="mb-3" *ngIf="isAdminSelected">
      <label for="adminCode" class="form-label">Admin Code</label>
      <input type="password" id="adminCode" formControlName="adminCode" class="form-control">
    </div>

    <div class="mb-3">
      <label for="photo" class="form-label">Photo</label>
      <input type="file" class="form-control" (change)="onPhotoSelected($event)">
    </div>

    <button type="submit" class="btn btn-primary">Register</button>
  </form>
</div>
